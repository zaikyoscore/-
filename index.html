    const tokens = new Set();
    const chars = t.split("");
    for (let i = 0; i < chars.length - 1; i++) tokens.add(chars[i] + chars[i + 1]);
    t.split(/[\s、。・,，.!?！？]+/).filter(w => w.length > 1).forEach(w => tokens.add(w));
    return tokens;
  }

  function similarity(a, b) {
    const sa = tokenize(a), sb = tokenize(b);
    let inter = 0;
    sa.forEach(t => { if (sb.has(t)) inter++; });
    const union = sa.size + sb.size - inter;
    return union === 0 ? 0 : inter / union;
  }

  function renderSearch(query) {
    crumbEl.innerHTML = "";
    bodyEl.innerHTML = "";
    const q = query.trim();
    if (!q) { renderNode("root", false); return; }

    const scored = searchIndex.map(item => ({
      ...item,
      score: similarity(q, item.path.join(" ")) * 0.6 + similarity(q, item.answer) * 0.4
    })).filter(r => r.score > 0.01).sort((a, b) => b.score - a.score).slice(0, 5);

    if (scored.length === 0) {
      const el = document.createElement("div");
      el.className = "ac-no-results";
      el.textContent = "「" + q + "」に一致する項目が見つかりませんでした";
      bodyEl.appendChild(el);
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "ac-search-results";
    scored.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "ac-search-item";
      const pathEl = document.createElement("div");
      pathEl.className = "ac-search-item-path";
      pathEl.textContent = item.path.join(" › ");
      const labelEl = document.createElement("div");
      labelEl.className = "ac-search-item-label";
      labelEl.textContent = item.path[item.path.length - 1] || "";
      const answerEl = document.createElement("div");
      answerEl.className = "ac-search-item-answer";
      answerEl.textContent = item.answer;
      btn.appendChild(pathEl);
      btn.appendChild(labelEl);
      btn.appendChild(answerEl);
      btn.addEventListener("click", () => {
        searchInput.value = "";
        path = ["root", item.id];
        labelMap[item.id] = item.path[item.path.length - 1];
        renderNode(item.id, false);
      });
      wrap.appendChild(btn);
    });
    bodyEl.appendChild(wrap);
  }

  searchInput.addEventListener("input", (e) => renderSearch(e.target.value));

  launcher.addEventListener("click", () => {
    const isOpen = root.classList.toggle("open");
    if (isOpen && bodyEl.childElementCount === 0) renderNode("root");
    if (isOpen) setTimeout(() => searchInput.focus(), 100);
  });

  function renderBreadcrumb() {
    crumbEl.innerHTML = "";
    path.forEach((nodeId, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "ac-crumb-sep"; sep.textContent = "›";
        crumbEl.appendChild(sep);
      }
      const btn = document.createElement("button");
      btn.className = "ac-crumb";
      btn.textContent = i === 0 ? "はじめから" : (labelMap[nodeId] || nodeId);
      btn.addEventListener("click", () => jumpTo(i));
      crumbEl.appendChild(btn);
    });
  }

  function jumpTo(index) {
    path = path.slice(0, index + 1);
    renderNode(path[index], false);
  }

  function renderNode(nodeId, pushHistory = true) {
    const node = TREE[nodeId];
    if (!node) return;
    if (pushHistory && path[path.length - 1] !== nodeId) path.push(nodeId);
    renderBreadcrumb();
    bodyEl.innerHTML = "";

    if (node.message) {
      const msg = document.createElement("div");
      msg.className = "ac-msg"; msg.textContent = node.message;
      bodyEl.appendChild(msg);
    }
    if (node.answer) {
      const msg = document.createElement("div");
      msg.className = "ac-msg"; msg.textContent = node.answer;
      bodyEl.appendChild(msg);
      if (node.ctas && node.ctas.length) {
        node.ctas.forEach(cta => {
          const a = document.createElement("a");
          a.className = "ac-cta-btn"; a.href = cta.url; a.target = "_blank"; a.textContent = cta.label;
          a.style.marginBottom = "4px";
          bodyEl.appendChild(a);
        });
      }
      const restart = document.createElement("button");
      restart.className = "ac-restart"; restart.textContent = "最初の質問に戻る";
      restart.addEventListener("click", () => { path = ["root"]; renderNode("root", false); });
      bodyEl.appendChild(restart);
    }
    if (node.options && node.options.length) {
      const wrap = document.createElement("div");
      wrap.className = "ac-options";
      node.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "ac-option-btn"; btn.textContent = opt.label;
        btn.addEventListener("click", () => { labelMap[opt.next] = opt.label; renderNode(opt.next); });
        wrap.appendChild(btn);
      });
      bodyEl.appendChild(wrap);
    }
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }
})();
</script>
