<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>試合状況ボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f0f0f;--paper:#f5f3ee;--accent:#d4420a;--mid:#6b6560;
  --line:#d8d4cc;--card:#fff;--green:#1a6b3a;--blue:#1a4fa0;
  --mono:'DM Mono',monospace;--sans:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;}

.header{background:var(--ink);color:#fff;padding:14px 20px;border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-icon{font-size:22px;}
.header-title{font-size:17px;font-weight:900;}
.header-sub{font-size:10px;color:#aaa;font-family:var(--mono);}
.update-info{font-size:10px;color:#aaa;font-family:var(--mono);text-align:right;white-space:nowrap;}

/* タブ */
.tabs{display:flex;background:var(--ink);padding:0 20px;overflow-x:auto;gap:0;border-top:1px solid #333;}
.tab{padding:10px 20px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:#888;white-space:nowrap;transition:color .15s;}
.tab.active{color:#fff;border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:#ccc;}

.main{max-width:900px;margin:0 auto;padding:16px 14px;}
.tab-content{display:none;}.tab-content.active{display:block;}

/* 順位表 */
.standings-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.standings-block{background:var(--card);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
.standings-block-header{background:var(--ink);color:#fff;padding:9px 13px;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.standings-block-header span{font-family:var(--mono);font-size:9px;color:#999;}
.st-table{width:100%;border-collapse:collapse;font-size:12px;}
.st-table th{padding:6px 9px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--mid);border-bottom:1px solid var(--line);background:#fafaf8;}
.st-table th:first-child{text-align:left;}
.st-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center;}
.st-table td:first-child{text-align:left;font-weight:700;}
.st-table tr:last-child td{border-bottom:none;}
.st-table tr.rank-1 td{background:#fffbe6;}
.rank-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);}

/* 試合結果 */
.results-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{font-size:11px;padding:5px 12px;border:1.5px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;font-family:var(--sans);font-weight:700;color:var(--mid);transition:all .15s;}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.result-card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;}
.result-card-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafaf8;}
.result-card-id{font-family:var(--mono);font-size:10px;color:var(--mid);}
.result-card-vs{font-weight:900;font-size:14px;flex:1;}
.result-card-winner{font-size:11px;font-weight:700;color:var(--green);background:#e8f5ec;padding:2px 8px;border-radius:10px;}
.result-doubles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);}
.result-dbl{padding:10px 12px;border-right:1px solid var(--line);font-size:12px;}
.result-dbl:last-child{border-right:none;}
.result-dbl-label{font-family:var(--mono);font-size:10px;font-weight:700;margin-bottom:5px;}
.result-dbl-label.d1{color:var(--blue);}
.result-dbl-label.d2{color:var(--green);}
.result-dbl-label.d3{color:#92400e;}
.result-dbl-score{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px;}
.result-dbl-score .win{font-weight:900;color:var(--ink);}
.result-dbl-score .lose{color:var(--mid);}
.result-dbl-winner{font-size:10px;color:var(--green);font-weight:700;}
.result-players{font-size:10px;color:var(--mid);margin-top:3px;}

/* ローディング */
.loading{text-align:center;padding:48px 20px;color:var(--mid);}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:36px;color:var(--mid);font-size:13px;}
.error{background:#fee;border:1.5px solid #fcc;border-radius:8px;padding:12px 16px;color:#c00;font-size:13px;margin-bottom:12px;}

/* 自動更新バッジ */
.auto-badge{font-size:10px;font-family:var(--mono);background:#1a6b3a;color:#fff;padding:2px 7px;border-radius:10px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🏸</div>
    <div>
      <div class="header-title" id="tournament-title">試合状況ボード</div>
      <div class="header-sub">LIVE SCOREBOARD</div>
    </div>
  </div>
  <div class="update-info">
    <span class="auto-badge">自動更新</span><br>
    <span id="last-updated"></span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('standings')">📊 順位表</div>
  <div class="tab" onclick="switchTab('results')">📋 試合結果</div>
</div>

<div class="main">
  <!-- 順位表タブ -->
  <div class="tab-content active" id="tab-standings">
    <div id="standings-wrap" class="standings-wrap">
      <div class="loading"><div class="spinner"></div>読み込み中...</div>
    </div>
  </div>

  <!-- 試合結果タブ -->
  <div class="tab-content" id="tab-results">
    <div class="results-filter" id="results-filter"></div>
    <div id="results-wrap">
      <div class="loading"><div class="spinner"></div>読み込み中...</div>
    </div>
  </div>
</div>

<script>
const P = new URLSearchParams(location.search);
const GAS_URL = P.get('gas') || '';

let allStandings = [];
let allResults   = [];
let activeDiv    = 'ALL';
let activeTab    = 'standings';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active', (i===0&&tab==='standings')||(i===1&&tab==='results'));
  });
  document.getElementById('tab-standings').classList.toggle('active', tab==='standings');
  document.getElementById('tab-results').classList.toggle('active', tab==='results');
}

// ================================================================
// データ取得
// ================================================================
async function fetchAll(){
  if(!GAS_URL){
    document.getElementById('standings-wrap').innerHTML = '<div class="error">GAS URLが設定されていません</div>';
    document.getElementById('results-wrap').innerHTML = '<div class="error">GAS URLが設定されていません</div>';
    return;
  }
  try{
    const [sRes, rRes] = await Promise.all([
      fetch(GAS_URL + '?action=getStandings'),
      fetch(GAS_URL + '?action=getResults'),
    ]);
    const sData = await sRes.json();
    const rData = await rRes.json();

    if(sData.status==='ok') allStandings = sData.standings||[];
    if(rData.status==='ok') allResults   = rData.results||[];

    // 部門フィルターボタンを構築
    buildDivFilter();
    renderStandings();
    renderResults();

    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString('ja-JP');
  }catch(err){
    document.getElementById('standings-wrap').innerHTML = `<div class="error">取得失敗: ${esc(err.message)}</div>`;
    document.getElementById('results-wrap').innerHTML   = `<div class="error">取得失敗: ${esc(err.message)}</div>`;
  }
}

function buildDivFilter(){
  const divs = [...new Set(allStandings.map(s=>s.division||'').filter(Boolean))];
  const wrap = document.getElementById('results-filter');
  wrap.innerHTML =
    `<button class="filter-btn ${activeDiv==='ALL'?'active':''}" onclick="setDiv('ALL')">全部門</button>` +
    divs.map(d=>`<button class="filter-btn ${activeDiv===d?'active':''}" onclick="setDiv('${esc(d)}')">${esc(d)}</button>`).join('');
}

function setDiv(div){
  activeDiv = div;
  buildDivFilter();
  renderStandings();
  renderResults();
}

// ================================================================
// 順位表描画
// ================================================================
function renderStandings(){
  const wrap = document.getElementById('standings-wrap');
  const filtered = activeDiv==='ALL'
    ? allStandings
    : allStandings.filter(s=>s.division===activeDiv);

  if(filtered.length===0){
    wrap.innerHTML='<div class="empty">まだ試合結果がありません</div>';
    return;
  }

  // division → block でグループ化
  const byDivBlock={};
  filtered.forEach(s=>{
    const key = (s.division||'') + '-' + (s.block||'');
    if(!byDivBlock[key]) byDivBlock[key]={div:s.division||'',block:s.block||'',rows:[]};
    byDivBlock[key].rows.push(s);
  });

  wrap.innerHTML = Object.values(byDivBlock).map(({div,block,rows})=>`
    <div class="standings-block">
      <div class="standings-block-header">
        <span>${esc(div)} ブロック${esc(block)}</span>
        <span>${rows.length}チーム</span>
      </div>
      <table class="st-table">
        <thead><tr>
          <th>チーム名</th><th>対戦</th><th>勝</th><th>負</th>
          <th>得失試合</th><th>得失ゲーム</th><th>得失点</th><th>順位</th>
        </tr></thead>
        <tbody>
          ${rows.map((s,i)=>`
            <tr class="${i===0?'rank-1':''}">
              <td>${esc(s.team)}</td>
              <td>${s.played||0}</td>
              <td style="font-weight:700;color:var(--green)">${s.cardW||0}</td>
              <td>${s.cardL||0}</td>
              <td style="color:${(s.cardW-s.cardL)>=0?'var(--green)':'var(--accent)'}">${s.cardW-s.cardL>=0?'+':''}${s.cardW-s.cardL}</td>
              <td style="color:${(s.gameW-s.gameL)>=0?'var(--green)':'var(--accent)'}">${s.gameW-s.gameL>=0?'+':''}${s.gameW-s.gameL}</td>
              <td style="color:${((s.pointW||0)-(s.pointL||0))>=0?'var(--green)':'var(--accent)'}">${((s.pointW||0)-(s.pointL||0))>=0?'+':''}${(s.pointW||0)-(s.pointL||0)}</td>
              <td><span class="rank-num">${esc(s.rank||'')}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');
}

// ================================================================
// 試合結果描画
// ================================================================
function renderResults(){
  const wrap = document.getElementById('results-wrap');

  // cardIdでグループ化（D1/D2/D3をまとめる）
  const cardMap = {};
  allResults.forEach(r=>{
    if(!cardMap[r.cardId]) cardMap[r.cardId] = {cardId:r.cardId, teamA:r.teamA, teamB:r.teamB, doubles:{}};
    cardMap[r.cardId].doubles[r.dbl] = r;
  });

  // 部門フィルター（cardIdのプレフィックスで判定）
  const cards = Object.values(cardMap).filter(c=>{
    if(activeDiv==='ALL') return true;
    return c.cardId.startsWith(activeDiv);
  });

  if(cards.length===0){
    wrap.innerHTML='<div class="empty">まだ試合結果がありません</div>';
    return;
  }

  // 新しい順に並べる
  wrap.innerHTML = cards.reverse().map(c=>{
    // 対戦カード勝者を判定
    let cardWinner = '';
    let aWins=0, bWins=0;
    ['D1','D2','D3'].forEach(dbl=>{
      const r = c.doubles[dbl];
      if(!r) return;
      if(r.winner===c.teamA) aWins++;
      else if(r.winner===c.teamB) bWins++;
    });
    if(aWins>=2) cardWinner=c.teamA;
    else if(bWins>=2) cardWinner=c.teamB;

    const doublesHtml = ['D1','D2','D3'].map(dbl=>{
      const r = c.doubles[dbl];
      if(!r) return `<div class="result-dbl"><div class="result-dbl-label ${dbl.toLowerCase()}">${dbl}</div><div style="color:var(--mid);font-size:11px;">未実施</div></div>`;

      const scores = [[r.g1a,r.g1b],[r.g2a,r.g2b],[r.g3a,r.g3b]]
        .filter(([a,b])=>a!=='-'&&b!=='-'&&a!==''&&b!=='')
        .map(([a,b])=>{
          const aWin = Number(a)>Number(b);
          return `<div class="result-dbl-score"><span class="${aWin?'win':'lose'}">${a}</span><span style="color:#ccc">-</span><span class="${aWin?'lose':'win'}">${b}</span></div>`;
        }).join('');

      const winner = r.winner ? `<div class="result-dbl-winner">🏆 ${esc(r.winner)}</div>` : '';
      const aPlayers = r.aPlayers ? `<div class="result-players">${esc(r.aPlayers)}</div>` : '';
      const bPlayers = r.bPlayers ? `<div class="result-players">${esc(r.bPlayers)}</div>` : '';

      return `
        <div class="result-dbl">
          <div class="result-dbl-label ${dbl.toLowerCase()}">${dbl}</div>
          ${scores}
          ${winner}
          ${aPlayers}
          ${bPlayers}
        </div>`;
    }).join('');

    return `
      <div class="result-card">
        <div class="result-card-header">
          <span class="result-card-id">${esc(c.cardId)}</span>
          <span class="result-card-vs">${esc(c.teamA)} vs ${esc(c.teamB)}</span>
          ${cardWinner?`<span class="result-card-winner">🏆 ${esc(cardWinner)}</span>`:''}
        </div>
        <div class="result-doubles">${doublesHtml}</div>
      </div>`;
  }).join('');
}

// ================================================================
// 起動・自動更新（結果件数が変わったら即反映、変わらなければ30秒ごとに確認）
// ================================================================
let lastResultCount = -1;

async function checkAndUpdate(){
  if(!GAS_URL) return;
  try{
    // 結果件数だけ軽く確認
    const res  = await fetch(GAS_URL + '?action=getResults');
    const data = await res.json();
    const count = (data.results||[]).length;

    if(count !== lastResultCount){
      // 件数が変わった → フルで取得・描画
      lastResultCount = count;
      allResults = data.results||[];
      const sRes  = await fetch(GAS_URL + '?action=getStandings');
      const sData = await sRes.json();
      if(sData.status==='ok') allStandings = sData.standings||[];
      buildDivFilter();
      renderStandings();
      renderResults();
      document.getElementById('last-updated').textContent =
        new Date().toLocaleTimeString('ja-JP') + ' 更新';
    } else {
      // 変化なし → 時刻だけ更新
      document.getElementById('last-updated').textContent =
        new Date().toLocaleTimeString('ja-JP') + ' 確認済';
    }
  } catch(_){}
}

fetchAll().then(()=>{ lastResultCount = allResults.length; });
setInterval(checkAndUpdate, 15000); // 15秒ごとに確認
</script>
</body>
</html>
