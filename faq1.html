  .faq-toc-btn:hover { background: #2b6f5c; color: #fff; }

<script>
(function(){
  const sections = [{"title":"出願について","items":[{"category":"出願について","question":"出願方法を教えてください。","answer":"インターネット出願サイトにて、マイページ登録・出願内容の登録・検定料の支払いを行ってください。<div>ここまで手続きを終えると入学志願票と出願書類を郵送するためのラベルの印刷が可能になります。</div><div>所定の期間内に出願書類を郵送いただくことで出願は完了となります。</div>","ctas":[]},{"category":"出願について","question":"出願期間について教えてください。","answer":"令和９年度入試の出願期間は以下のとおりです。<div>詳細は学生募集要項でご確認ください。<div><span style=\"font-family: inherit;\">【教職大学院A日程・修士課程】</span></div><div><span style=\"font-family: inherit;\">・マイページ登録、出願内容の登録、検定料の支払い</span></div><div><span style=\"font-family: inherit;\">　<u>令和8年8月21日（金）9時～8月28日（金）15時</u></span></div><div><span style=\"font-family: inherit;\">&nbsp;・出願書類の印刷と郵送</span></div><div><span style=\"font-family: inherit;\">　<u>令和8年9月1日（火）※必着</u></span><span style=\"font-family: inherit;\"><u>&nbsp;</u></span></div><div><br></div><div>【教職大学院B日程】</div><div><span style=\"font-family: inherit;\">・マイページ登録、出願内容の登録、検定料の支払い</span></div><div><span style=\"font-family: inherit;\">　<u>令和9年1月14日（木）9時～1月20日（水）15時</u></span></div><div><span style=\"font-family: inherit;\">&nbsp;・出願書類の印刷と郵送</span></div><div><span style=\"font-family: inherit;\">　<u>令和9年1月22日（金）※必着</u><br></span></div></div>","ctas":[]},{"category":"出願について","question":"出願書類は手書きで記入する必要がありますか。","answer":"注書き等で指示がある場合を除き、記入方法の指定はしておりません。<div>ただし、入試情報サイトに掲載しているPDFの様式以外での様式の提供は行っておりません。</div>","ctas":[]},{"category":"出願について","question":"出願書類について、スペースが足りないので、枠を超えて記入することはできますか。","answer":"注書き等で指示がある場合を除き、所定の枠内に収まるように記載してください。<div>参考文献や引用等がある場合も、そちらも含めて当該様式内に、ご記載いただく必要がございます。</div>","ctas":[]},{"category":"出願について","question":"これまでの研究資料やポートフォリオを提出したいです。","answer":"出願書類として求められている場合や注書き等で許可されている場合を除き、様式外の資料を添付することはできません。","ctas":[]},{"category":"出願について","question":"大学4年生です。出願時に提出する成績証明書には、3年次までの成績しか掲載されていないのですが、どうすればいいですか。","answer":"<span style=\"font-size: 13px;\">原則、４年生前期の成績が反映されたものが望ましいですが、出願期間に間に合わない場合は、3年後期までの成績証明書をご提出ください。</span><div><span style=\"font-size: 13px;\">なお、その場合、別途、入試課よりご連絡させていただく場合がございます。</span></div>","ctas":[]},{"category":"出願について","question":"外国人留学生等選抜で出願予定です。海外に住んでいるため、「住民票」の提出ができません。","answer":"<span style=\"font-size: 13px;\">短期滞在等のご事情で住民票が発行できない方につきましては、パスポートやビザの写し（氏名・顔写真が確認できるページ）をご提出ください。</span>","ctas":[]},{"category":"出願について","question":"入学志願票の様式が見つかりません。","answer":"インターネット出願サイトにて、マイページ登録・出願内容の登録・検定料の支払いを行ってください。<div>ここまで手続きを終えると入学志願票と出願書類を郵送するためのラベルの印刷が可能になります。</div>","ctas":[]},{"category":"出願について","question":"職歴にアルバイトの経験は記載する必要がありますか。","answer":"<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"438\" style=\"border-collapse:\n collapse;width:329pt\"><tbody><tr height=\"25\" style=\"height:18.75pt\">\n  <td height=\"25\" class=\"xl63\" width=\"438\" style=\"height:18.75pt;width:329pt\">アルバイト等は職歴への記入は不要です。</td></tr></tbody></table>","ctas":[]},{"category":"出願について","question":"出願書類を直接窓口に持ち込むことは可能ですか。","answer":"<span style=\"font-size: 13px;\">直接窓口にて提出することはできません。</span><div><span style=\"font-size: 13px;\">所定の期間内に、出願書類等一式を角形２号封筒にまとめて封入し、「書留速達」により東京学芸大学入試課まで郵送してください。</span></div>","ctas":[]},{"category":"出願について","question":"出願書類を海外から郵送する際の指定事項や注意点などを教えてください。","answer":"特に指定はございませんので、所定の期間内に確実に届くよう郵送をお願いいたします。&nbsp;<div>なお、出願書類を入れた封筒は、検定料支払い後にダウンロードできる出願書類提出用宛名シートを張り付けてから、海外郵送用の袋に封入し、送付してください。</div>","ctas":[]},{"category":"出願について","question":"入学志願票の様式が見つかりません。","answer":"インターネット出願サイトにて、マイページ登録・出願内容の登録・検定料の支払いを行ってください。<div>ここまで手続きを終えると入学志願票と出願書類を郵送するためのラベルの印刷が可能になります。</div>","ctas":[]},{"category":"出願について","question":"検定料の支払い後に登録内容の誤りが見つかりました。","answer":"<div>出願内容登録後は、登録内容変更を認めておりませんので、<span style=\"font-family: inherit;\">WEB上での修正はできません。</span></div><div>ただし、氏名・連絡先・住所等の必要事項については、こちらで修正いたしますので、<span style=\"font-family: inherit;\">下記問い合わせフォームより、お名前・登録番号・修正点をご連絡ください。</span></div>","ctas":[{"label":"入試に関するお問い合わせフォーム","url":"https://forms.office.com/Pages/ResponsePage.aspx?id=JV8MPrcmfUiS2dHOCM5aW7SZXYvLzztDij6dscR_72pUNzVWN0VZSlBIUVVTNDVBTTVDMTRXQ01JUiQlQCN0PWcu"}]},{"category":"出願について","question":"出願期間を過ぎてしまいました。","answer":"所定の期間内にすべての手続きが終了しない場合、出願はできません。<div>必ず所定の期間内に手続きをお願いいたします。</div>","ctas":[]},{"category":"出願について","question":"出願書類が無事に届いているか不安です。","answer":"<span style=\"font-size: 13px;\">出願書類の到着状況について、個別にはお答えしておりません。</span><div><span style=\"font-size: 13px;\">出願書類が受理されなかった場合、書類一式は返却いたします。</span></div><div><span style=\"font-size: 13px;\">また、出願書類が受理された方のみ、受験票の印刷が可能になります。</span></div>","ctas":[]}]},{"title":"試験日程について","items":[{"category":"試験日程について","question":"二次募集は実施されますか。","answer":"入学定員に不足が生じた場合は、欠員補充のための第２次募集を実施することがあります。<div>欠員補充第２次募集を実施する場合は、１２月中旬以降に本学ウェブサイトに募集要項等を掲載します。</div>","ctas":[]},{"category":"試験日程について","question":"試験の日程を教えてください。","answer":"令和９年度入試の実施日は以下のとおりです。<div>詳細は学生募集要項でご確認ください。<div>【教職大学院】</div><div>　A日程・・・令和８年10月17日（土） ※<span style=\"font-family: inherit;\">予備日10月18日（日）</span></div><div>　B日程・・・令和９年２月13日（日）</div><div><br></div><div>【修士課程】</div><div>　令和８<span style=\"font-family: inherit;\">年10月17日（土）、18日（日）</span></div></div>","ctas":[]},{"category":"試験日程について","question":"B日程について教えてください。","answer":"B日程は、教職大学院の派遣教員選抜のみ実施します。<div>派遣教員選抜にて、教職大学院を出願される場合、A日程・B日程のどちらでも出願は可能ですが、教育委員会によっては受験時期（合格発表時期）が指定される場合があります。<div>出願前に一度、派遣元の教育委員会等へご確認ください。</div></div>","ctas":[]},{"category":"試験日程について","question":"教職大学院と修士課程の併願は可能ですか。","answer":"同一日程での試験実施になりますので、併願はできません。","ctas":[]},{"category":"試験日程について","question":"予備日に受験することは可能ですか。","answer":"予備日は災害や交通機関の大規模な乱れなど不測の事態に備えて設定しております。&nbsp;<div>受験者の個別事情により予備日を選択して受験することはできません。</div>","ctas":[]},{"category":"試験日程について","question":"病気で欠席した場合、追試験を受けることはできますか。","answer":"追試験は実施しておりません。","ctas":[]}]},{"title":"選抜区分・試験科目について","items":[{"category":"選抜区分・試験科目について","question":"教職大学院","answer":"下記の5つの選抜区分があります。<div>&nbsp;・一般選抜</div><div>&nbsp;・現職教員選抜</div><div>&nbsp;・派遣教員選抜</div><div>&nbsp;・外国人留学生等選抜</div><div>&nbsp;・特別選抜</div><div><br></div><div>それぞれの出願要件や募集しているプログラム・サブプログラムについては、募集要項をご確認ください。</div><div>・<u>出願要件・・・4-5ページ&nbsp;</u></div><div>・<u>募集状況・試験科目について →16-22ページ</u></div>","ctas":[{"label":"令和9年度教職大学院募集要項はこちら","url":"https://www.u-gakugei.ac.jp/nyushi/upload/a33c7c5bd024e229c36f79dfc6b0181844fd3a18.pdf"}]},{"category":"選抜区分・試験科目について","question":"修士課程","answer":"下記の6つの選抜区分があります。<div>・一般選抜</div><div>・現職教員選抜</div><div>・派遣教員選抜</div><div>・社会人選抜</div><div>・教育支援人材特別選抜</div><div>・外国人留学生等選抜</div><div><br></div><div>それぞれの出願要件や募集しているプログラム・サブプログラムについては、募集要項をご確認ください。</div><div><div>・<u>出願要件・・・4-5ページ&nbsp;</u></div><div>・<u>募集状況・試験科目について →14-16ページ</u></div></div>","ctas":[]},{"category":"選抜区分・試験科目について","question":"出願時の選択した科目から変更して受験をしたいです。","answer":"<div><span style=\"font-size: 13px;\">出願内容登録後は、登録内容の変更を認めません。</span></div><div><span style=\"font-size: 13px;\">十分に確認の上、登録してください。</span></div>","ctas":[]},{"category":"選抜区分・試験科目について","question":"面接の内容や流れについて教えてください。","answer":"<span style=\"font-size: 13px;\">公平性の観点から、学生募集要項に記載以上の内容はお答えしておりません。</span>","ctas":[]},{"category":"選抜区分・試験科目について","question":"受験票はいつ届きますか。","answer":"<span style=\"font-size: 13px;\">受験票は、下記の日程にてマイページから印刷が可能です。</span><div><span style=\"font-size: 13px;\">各自で印刷の上、当日持参してください。</span></div><div><span style=\"font-size: 13px;\">なお、印刷は何度でも可能です。</span></div><div><span style=\"font-size: 13px;\"><br></span></div><div><span style=\"font-size: 13px;\">【教職大学院A日程・修士課程】</span></div><div><span style=\"font-size: 13px;\"><u>令和8年9月24日（木）10時頃</u></span></div><div><span style=\"font-size: 13px;\">【教職大学院B日程】</span></div><div><span style=\"font-size: 13px;\"><u>令和9年2月&nbsp; 5日（金）10時頃</u></span></div>","ctas":[]},{"category":"選抜区分・試験科目について","question":"入試に向けた学習や準備を教えてください。","answer":"受験に向けた学習や準備につきましては、公平性の観点からお答えしておりません。&nbsp;<div>下記サイトにて、過去問題を公開しておりますので、参考にしてください。</div>","ctas":[{"label":"過去問題はこちら","url":"https://www.cybercollege.jp/u-gakugei-gs/index.php"}]},{"category":"選抜区分・試験科目について","question":"試験科目を教えてください。","answer":"選抜区分や出願先の専攻・プログラム・サブプログラムによって異なります。<div>学生募集要項の以下のページでご確認ください。<div>【教職大学院】<u>p.14、p.16-22</u></div><div>【修士課程】<u>p.14-16</u></div></div>","ctas":[{"label":"令和9年度学生募集要項（教職大学院）","url":"https://www.u-gakugei.ac.jp/nyushi/upload/a33c7c5bd024e229c36f79dfc6b0181844fd3a18.pdf"},{"label":"令和9年度学生募集要項（修士課程）","url":"https://www.u-gakugei.ac.jp/nyushi/upload/529f7279ee323fbf35ada10424393afa5fe90595.pdf"}]}]},{"title":"受験当日について","items":[{"category":"受験当日について","question":"車での入構は可能ですか。","answer":"車での入構はできません。<div>公共交通機関を利用してご来学ください。</div>","ctas":[]},{"category":"受験当日について","question":"保護者同伴で入構することは可能ですか。","answer":"受験者以外の方の入構はできません。&nbsp;<div>特別な事情がある場合は、必ず事前にご連絡ください。</div>","ctas":[]},{"category":"受験当日について","question":"控室は用意されていますか。","answer":"控室の用意はありません。<div>掲示板で試験室を確認の上、会場へ向かってください。</div><div>受験者の入室開始時刻は受験者心得（掲載時期は募集要項を要確認）でご確認ください。</div>","ctas":[]},{"category":"受験当日について","question":"食堂はありますか。","answer":"入試当日は食堂・購買は営業していません。<div>大学の近くにコンビニはありますが、試験室からは距離があるため昼食の持参を推奨します。<div>なお、構内の自動販売機（飲料のみ）の利用は可能です。</div></div>","ctas":[]},{"category":"受験当日について","question":"受験を辞退したいです。","answer":"<span style=\"font-size: 13px;\">出願書類受理後の辞退につきましては、当日の欠席とさせていただきますので、特段のお手続きの必要はございません。</span><div><span style=\"font-size: 13px;\">学生募集要項に記載の通り、検定料の返金対象には該当いたしませんので、ご了承ください。</span></div>","ctas":[]}]},{"title":"入学後に関する質問について（カリキュラム・免許・奨学金など）","items":[{"category":"入学後に関する質問について（カリキュラム・免許・奨学金など）","question":"働きながら大学院に通うことができますか。","answer":"長期履修制度や現職教員で一定の基準を満たした方への単位免除（教職大学院のみ）等の制度を設けております。<div>詳細は、下記HPをご確認ください。</div>","ctas":[{"label":"教職大学院のご案内","url":"https://www.u-gakugei.ac.jp/graduate/professional/about/"},{"label":"修士課程のご案内","url":"https://www.u-gakugei.ac.jp/graduate/master/policy/"}]},{"category":"入学後に関する質問について（カリキュラム・免許・奨学金など）","question":"免許取得について相談したいです。","answer":"下記の問い合わせフォームよりお問い合わせください。","ctas":[{"label":"教職大学院お問い合わせフォーム","url":"https://forms.office.com/pages/responsepage.aspx?id=JV8MPrcmfUiS2dHOCM5aW9cOK4ae5IRLlUCFB_S91EBUOE5IODFOUzUzRFNGMFFSNVY2NDJBT0dVUSQlQCN0PWcu&route=shorturl"}]},{"category":"入学後に関する質問について（カリキュラム・免許・奨学金など）","question":"奨学金や授業料免除制度について教えてください。","answer":"下記よりご確認ください。","ctas":[{"label":"奨学金についてはこちら","url":"https://www.u-gakugei.ac.jp/scholarship/"},{"label":"入学料・授業料の免除・徴収猶予制度について","url":"https://www.u-gakugei.ac.jp/tuition-exemption/"}]}]},{"title":"よくある質問について","items":[{"category":"よくある質問について","question":"研究室訪問は必須ですか。","answer":"派遣教員選抜で修士課程に出願される方を除き、研究室訪問を必須とはしておりません。希望される方は、下記よりお問い合わせください。","ctas":[{"label":"教職大学院お問い合わせフォーム","url":"https://forms.office.com/pages/responsepage.aspx?id=JV8MPrcmfUiS2dHOCM5aW9cOK4ae5IRLlUCFB_S91EBUOE5IODFOUzUzRFNGMFFSNVY2NDJBT0dVUSQlQCN0PWcu&route=shorturl"},{"label":"修士課程お問い合わせフォーム","url":"https://forms.office.com/pages/responsepage.aspx?id=JV8MPrcmfUiS2dHOCM5aWxpo_M5fGpxLnG-0dgEl6GdURjQxWFI3NFI3MlM0TzJZUkNQVlNLQjZGRiQlQCN0PWcu&route=shorturl"}]},{"category":"よくある質問について","question":"出願前に教員に研究相談がしたいです。","answer":"希望される方は、下記よりお問い合わせください。","ctas":[{"label":"教職大学院お問い合わせフォーム","url":"https://forms.office.com/pages/responsepage.aspx?id=JV8MPrcmfUiS2dHOCM5aW9cOK4ae5IRLlUCFB_S91EBUOE5IODFOUzUzRFNGMFFSNVY2NDJBT0dVUSQlQCN0PWcu&route=shorturl"},{"label":"修士課程お問い合わせフォーム","url":"https://forms.office.com/pages/responsepage.aspx?id=JV8MPrcmfUiS2dHOCM5aWxpo_M5fGpxLnG-0dgEl6GdURjQxWFI3NFI3MlM0TzJZUkNQVlNLQjZGRiQlQCN0PWcu&route=shorturl"}]},{"category":"よくある質問について","question":"過去問題はどこで閲覧できますか。","answer":"本学の附属図書館にて、過去5年分、<span style=\"font-family: inherit;\">下記のリンクより過去3年分の閲覧が可能です。</span><div><span style=\"font-family: inherit;\">下記サイトにてご確認される場合は、パスワード入力を求められますので、画面右側の過去問題公開一覧大学の下部に記載しているパスワードを入力してください。</span><div><span style=\"font-size: 13px;\">スマートフォンからご確認いただいた場合は、パスワードが画面外に表示される場合があるため、右側にスクロールしてください。</span></div></div>","ctas":[{"label":"過去問題はこちら","url":"https://www.cybercollege.jp/u-gakugei-gs/index.php"}]},{"category":"よくある質問について","question":"オンラインでの受験は可能ですか。","answer":"令和9年度入試については、対面のみの実施になります。&nbsp;<div>今後の入試につきましては、現時点では未定です。&nbsp;</div>","ctas":[]},{"category":"よくある質問について","question":"大学院進学に関する説明会はありますか。","answer":"例年５月中旬に大学院説明会を開催しています。<div>詳細が決定次第、東京学芸大学HPにてお知らせいたします。</div>","ctas":[{"label":"東京学芸大学HP","url":"https://www.u-gakugei.ac.jp/"}]},{"category":"よくある質問について","question":"日本語能力試験の基準などはありますか。","answer":"<div><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">日本語能力試験の基準等は特に定めておりません。</span></div><div><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">また、結果の提出も求めておりません。</span></div><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">ただし、授業は原則</span><span data-markjs=\"true\" class=\"markj7wqxilil\" data-ogac=\"\" data-ogab=\"\" data-ogsc=\"\" data-ogsb=\"\" style=\"color: inherit; font: inherit; border: 0px; margin: 0px; padding: 0px; vertical-align: baseline;\">日本語</span><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">で行いますので、</span><span data-markjs=\"true\" class=\"markj7wqxilil\" data-ogac=\"\" data-ogab=\"\" data-ogsc=\"\" data-ogsb=\"\" style=\"color: inherit; font: inherit; border: 0px; margin: 0px; padding: 0px; vertical-align: baseline;\">日本語</span><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">のスピーキングとライティングができることは、</span><span style=\"color: inherit; font-family: 游ゴシック, serif, EmojiFont; font-size: 11pt; font-style: inherit; font-variant-ligatures: inherit; font-variant-caps: inherit; font-weight: inherit;\">修学上の前提条件となっております。</span>","ctas":[]},{"category":"よくある質問について","question":"過去の入試の志願者や合格者のデータを教えてください。","answer":"<span style=\"font-size: 13px;\">下記より、過年度入試の志願者・入学者数等をご確認いただけます。</span>","ctas":[{"label":"過年度入試の志願者・入学者数等","url":"https://www.u-gakugei.ac.jp/nyushi/shushi/-2.html"}]},{"category":"よくある質問について","question":"学生募集要項はいつ公開されますか。","answer":"入試を実施する年度の４月中旬から下旬頃に、出願書類の様式とあわせて公開予定です。<div>令和９年度入試の学生募集要項及び出願書類様式は令和８年４月１７日より公開しています。</div>","ctas":[{"label":"令和9年度学生募集要項（教職大学院）","url":"https://www.u-gakugei.ac.jp/nyushi/upload/a33c7c5bd024e229c36f79dfc6b0181844fd3a18.pdf"},{"label":"令和9年度学生募集要項（修士課程）","url":"https://www.u-gakugei.ac.jp/nyushi/upload/529f7279ee323fbf35ada10424393afa5fe90595.pdf"}]}]}];
  const root = document.getElementById("faq-root");
  let html = '<p class="faq-page-title">大学院入試に関するお問い合わせについて</p>';
  html += '<div class="faq-notice">令和９年度入学者選抜学生募集要項に記載の内容を掲載しております。<div>他年度に受験される場合、必ず当該年度の募集要項をご確認ください。</div></div>';
  // 目次
  html += '<div class="faq-toc">';
  sections.forEach((s,i) => { html += `<a class="faq-toc-btn" href="#faq-sec-${i}">${s.title}</a>`; });
  html += '</div>';
  // 各セクション
  sections.forEach((s,i) => {
    html += `<div class="faq-section" id="faq-sec-${i}"><p class="faq-section-title">${s.title}</p>`;
    s.items.forEach((item, j) => {
      const ctaHtml = (item.ctas||[]).filter(c=>c.label&&c.url).map(c=>`<a href="${c.url}" target="_blank" class="faq-cta">${c.label}</a>`).join(" ");
      html += `<div class="faq-item" data-idx="${i}-${j}">
        <div class="faq-question" onclick="toggleFaq(this)">${item.question}<span class="faq-arrow">▼</span></div>
        <div class="faq-answer">${item.answer}${ctaHtml ? "<br>" + ctaHtml : ""}</div>
      </div>`;
    });
    html += '</div>';
  });
  root.innerHTML = html;
  window.toggleFaq = function(el) { el.closest('.faq-item').classList.toggle('open'); };
})();
</script>
